services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────────────
  - type: web
    name: qontint-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
      python -m playwright install-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: qontint-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/qontint.db
      - key: GOOGLE_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash-8b
      - key: SCRAPER_DELAY_MS
        value: "0"
      - key: SCRAPER_MAX_RESULTS
        value: "5"
      - key: SCRAPER_HEADLESS
        value: "true"
      - key: ML_MODELS_DIR
        value: /data/ml_models
      - key: MODEL_RETRAIN_INTERVAL_DAYS
        value: "7"
      - key: CACHE_NOVELTY_TTL
        value: "3600"
      - key: CACHE_AUTHORITY_TTL
        value: "86400"
      - key: CACHE_RANKING_TTL
        value: "3600"
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      - key: RATE_LIMIT_SERP
        value: 10/minute
      - key: RATE_LIMIT_GENERATE
        value: 5/minute
      - key: API_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://qontint-frontend.onrender.com"]'

  # ── Frontend: React / Vite (Static Site) ─────────────────────────────────────
  - type: web
    name: qontint-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qontint-backend.onrender.com
